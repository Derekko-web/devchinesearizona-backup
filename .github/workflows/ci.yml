name: Dev CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_scraper: ${{ steps.filter.outputs.python_scraper }}
      wordpress_theme: ${{ steps.filter.outputs.wordpress_theme }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect scoped CI changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          set_all_changed() {
            echo "python_scraper=true" >> "$GITHUB_OUTPUT"
            echo "wordpress_theme=true" >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            set_all_changed
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          fi

          if [ -z "$base_sha" ] || [ -z "$head_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            set_all_changed
            exit 0
          fi

          changed_files="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$base_sha" "$head_sha" > "$changed_files"

          if grep -Eq '^(\.github/workflows/(ci|content-jobs)\.yml|dev\.chinesearizona\.com/web/(requirements\.txt|package(-lock)?\.json|scripts/|data/(scrape-staging|signal-desk-staging)/|src/data/generated-(scraped-businesses|directory-businesses|plaza-businesses|business-image-overrides|local-articles|signal-desk-queue)\.json))' "$changed_files"; then
            echo "python_scraper=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_scraper=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(\.github/(dependabot\.yml|workflows/(ci|dependency-review)\.yml)|chinesearizona\.com/public/wp-content/themes/twentytwentyfive/)' "$changed_files"; then
            echo "wordpress_theme=true" >> "$GITHUB_OUTPUT"
          else
            echo "wordpress_theme=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev.chinesearizona.com/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: dev.chinesearizona.com/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security:audit

      - name: Verify
        run: npm run verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: dev.chinesearizona.com/web/coverage
          if-no-files-found: ignore

      - name: Smoke homepage
        run: |
          set -euo pipefail

          log_file="$(mktemp)"
          html_file="$(mktemp)"
          curl_error_file="$(mktemp)"
          last_curl_error=""

          npm run start -- --hostname 127.0.0.1 --port 3000 > "$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$log_file" "$html_file" "$curl_error_file"
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            http_status="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output "$html_file" \
                --write-out "%{http_code}" \
                http://127.0.0.1:3000/ \
                2> "$curl_error_file" || true
            )"

            if [ "$http_status" = "200" ]; then
              if grep -q 'ChineseArizona' "$html_file"; then
                echo "Homepage smoke check passed."
                exit 0
              fi

              echo "Homepage responded but did not include the expected ChineseArizona marker." >&2
              cat "$log_file" >&2
              exit 1
            fi

            if [ "$http_status" != "000" ]; then
              echo "Homepage returned HTTP $http_status instead of 200." >&2
              cat "$curl_error_file" >&2
              cat "$log_file" >&2
              exit 1
            fi

            if [ -s "$curl_error_file" ]; then
              last_curl_error="$(cat "$curl_error_file")"
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next server exited before the homepage responded." >&2
              cat "$log_file" >&2
              exit 1
            fi

            sleep 1
          done

          echo "Timed out waiting for the homepage to respond." >&2
          if [ -n "$last_curl_error" ]; then
            echo "$last_curl_error" >&2
          fi
          cat "$log_file" >&2
          exit 1

  playwright-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev.chinesearizona.com/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: dev.chinesearizona.com/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dev.chinesearizona.com/web/playwright-report
          if-no-files-found: ignore

  python-scraper-tests:
    needs: changes
    if: needs.changes.outputs.python_scraper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev.chinesearizona.com/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: dev.chinesearizona.com/web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dev.chinesearizona.com/web/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --target .python-packages -r requirements.txt

      - name: Run scraper tests
        run: npm run scrape:test

  wordpress-theme:
    needs: changes
    if: needs.changes.outputs.wordpress_theme == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chinesearizona.com/public/wp-content/themes/twentytwentyfive
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: chinesearizona.com/public/wp-content/themes/twentytwentyfive/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Build theme CSS
        run: npm run build

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify
      - playwright-e2e
      - python-scraper-tests
      - wordpress-theme
    if: ${{ always() }}
    steps:
      - name: Check required job outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PLAYWRIGHT_E2E_RESULT: ${{ needs.playwright-e2e.result }}
          PYTHON_SCRAPER_RESULT: ${{ needs.python-scraper-tests.result }}
          WORDPRESS_THEME_RESULT: ${{ needs.wordpress-theme.result }}
          PYTHON_SCRAPER_REQUIRED: ${{ needs.changes.outputs.python_scraper }}
          WORDPRESS_THEME_REQUIRED: ${{ needs.changes.outputs.wordpress_theme }}
        run: |
          set -euo pipefail
          failed=false

          require_success() {
            local name="$1"
            local result="$2"

            if [ "$result" != "success" ]; then
              echo "$name must pass; got $result." >&2
              failed=true
            fi
          }

          require_success_when_needed() {
            local name="$1"
            local result="$2"
            local required="$3"

            if [ "$required" = "true" ]; then
              require_success "$name" "$result"
              return
            fi

            case "$result" in
              success|skipped)
                ;;
              *)
                echo "$name was optional for this change but ended as $result." >&2
                failed=true
                ;;
            esac
          }

          require_success "changes" "$CHANGES_RESULT"
          require_success "verify" "$VERIFY_RESULT"
          require_success "playwright-e2e" "$PLAYWRIGHT_E2E_RESULT"
          require_success_when_needed "python-scraper-tests" "$PYTHON_SCRAPER_RESULT" "$PYTHON_SCRAPER_REQUIRED"
          require_success_when_needed "wordpress-theme" "$WORDPRESS_THEME_RESULT" "$WORDPRESS_THEME_REQUIRED"

          if [ "$failed" = "true" ]; then
            exit 1
          fi
