name: Dev CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'dev.chinesearizona.com/web/**'
      - 'ops/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'dev.chinesearizona.com/web/**'
      - 'ops/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev.chinesearizona.com/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: dev.chinesearizona.com/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Smoke homepage
        run: |
          set -euo pipefail

          log_file="$(mktemp)"
          html_file="$(mktemp)"
          curl_error_file="$(mktemp)"
          last_curl_error=""

          npm run start -- --hostname 127.0.0.1 --port 3000 > "$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            rm -f "$log_file" "$html_file" "$curl_error_file"
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            http_status="$(
              curl \
                --location \
                --silent \
                --show-error \
                --output "$html_file" \
                --write-out "%{http_code}" \
                http://127.0.0.1:3000/ \
                2> "$curl_error_file" || true
            )"

            if [ "$http_status" = "200" ]; then
              if grep -q 'ChineseArizona' "$html_file"; then
                echo "Homepage smoke check passed."
                exit 0
              fi

              echo "Homepage responded but did not include the expected ChineseArizona marker." >&2
              cat "$log_file" >&2
              exit 1
            fi

            if [ "$http_status" != "000" ]; then
              echo "Homepage returned HTTP $http_status instead of 200." >&2
              cat "$curl_error_file" >&2
              cat "$log_file" >&2
              exit 1
            fi

            if [ -s "$curl_error_file" ]; then
              last_curl_error="$(cat "$curl_error_file")"
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next server exited before the homepage responded." >&2
              cat "$log_file" >&2
              exit 1
            fi

            sleep 1
          done

          echo "Timed out waiting for the homepage to respond." >&2
          if [ -n "$last_curl_error" ]; then
            echo "$last_curl_error" >&2
          fi
          cat "$log_file" >&2
          exit 1
