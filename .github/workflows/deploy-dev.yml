name: Deploy Dev

on:
  workflow_run:
    workflows:
      - Dev CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to deploy. Defaults to the selected ref.
        required: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.chinesearizona.com
    defaults:
      run:
        working-directory: dev.chinesearizona.com/web
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      CLOSED_LOOP_GITHUB_TOKEN: ${{ github.token }}
      VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
      VPS_PORT: ${{ secrets.DEV_VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.DEV_VPS_SSH_KNOWN_HOSTS }}
      VPS_USER: ${{ secrets.DEV_VPS_USER || 'derek' }}
      SSH_STRICT_HOST_KEY_CHECKING: yes
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Check deploy SHA is verified main
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail

          deploy_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "$deploy_sha" origin/main; then
            echo "Deploy target $deploy_sha is not on main. Deploy Dev only accepts main commits." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_CONCLUSION" = "success" ] && [ "$WORKFLOW_RUN_HEAD_SHA" = "$deploy_sha" ]; then
              echo "Deploy target $deploy_sha came from a successful Dev CI workflow_run."
              exit 0
            fi

            echo "Deploy target $deploy_sha did not come from a successful Dev CI workflow_run." >&2
            exit 1
          fi

          gate_conclusion="$(
            gh api \
              --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f head_sha="$deploy_sha" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].conclusion // empty'
          )"

          if [ "$gate_conclusion" != "success" ]; then
            echo "Deploy Dev for main SHA $deploy_sha requires a successful Dev CI run first." >&2
            echo "Dev CI is the deploy gate and includes ci-required, npm run verify, npm run e2e, scraper checks, and WordPress theme checks when applicable." >&2
            exit 1
          fi

      - name: Check deploy freshness
        id: freshness
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$DEPLOY_SHA" != "$latest_sha" ]; then
            echo "Skipping stale deploy for $DEPLOY_SHA; latest main is $latest_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.freshness.outputs.deploy == 'true'
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: dev.chinesearizona.com/web/package-lock.json

      - name: Install dependencies
        if: steps.freshness.outputs.deploy == 'true'
        run: npm ci

      - name: Verify before deploy
        if: steps.freshness.outputs.deploy == 'true'
        run: npm run verify

      - name: Configure SSH
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/dev_key
          chmod 600 ~/.ssh/dev_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            exit 0
          fi

          keyscan_output="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -4 -H -T 30 -p "$VPS_PORT" "$VPS_HOST" > "$keyscan_output" && [ -s "$keyscan_output" ]; then
              cat "$keyscan_output" >> ~/.ssh/known_hosts
              rm -f "$keyscan_output"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "ssh-keyscan failed; retrying in $((attempt * 5)) seconds." >&2
              sleep $((attempt * 5))
            fi
          done

          rm -f "$keyscan_output"
          echo "Unable to fetch the VPS SSH host key after 5 attempts; falling back to StrictHostKeyChecking=accept-new." >&2
          echo "SSH_STRICT_HOST_KEY_CHECKING=accept-new" >> "$GITHUB_ENV"

      - name: Deploy exact SHA to VPS
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          ssh -i ~/.ssh/dev_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectionAttempts=5 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking="$SSH_STRICT_HOST_KEY_CHECKING" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA CLOSED_LOOP_GITHUB_TOKEN=$CLOSED_LOOP_GITHUB_TOKEN bash -s" <<'REMOTE'
          set -euo pipefail

          cd /var/www
          previous_sha="$(git rev-parse HEAD)"
          runtime_data_root="/var/www/runtime-data/dev.chinesearizona.com/web"
          git_exclude_path="$(git rev-parse --git-path info/exclude)"
          mkdir -p "$(dirname "$git_exclude_path")"
          grep -qxF '/runtime-data/' "$git_exclude_path" 2>/dev/null || printf '%s\n' '/runtime-data/' >> "$git_exclude_path"
          generated_data_paths=(
            "dev.chinesearizona.com/web/data/sites/austin/radar-runtime/store.json"
            "dev.chinesearizona.com/web/data/sites/los-angeles/radar-runtime/store.json"
            "dev.chinesearizona.com/web/data/sf-bay-radar-runtime/store.json"
            "dev.chinesearizona.com/web/data/article-ingest-staging/english-translation-cache.json"
            "dev.chinesearizona.com/web/data/article-ingest-staging/chinese-translation-cache.json"
            "dev.chinesearizona.com/web/data/article-ingest-staging/sync-manifest.json"
            "dev.chinesearizona.com/web/src/data/generated-local-articles.json"
          )

          runtime_article_count() {
            node -e '
          const fs = require("node:fs");
          const file = process.argv[1];

          try {
            const data = JSON.parse(fs.readFileSync(file, "utf8"));
            const articles = Array.isArray(data)
              ? data
              : data && Array.isArray(data.articles)
                ? data.articles
                : null;

            if (articles) {
              console.log(articles.length);
            }
          } catch {
            process.exit(0);
          }
          ' "$1"
          }

          should_preserve_external_runtime_data() {
            local source_path="$1"
            local external_path="$2"
            local source_count=""
            local external_count=""

            if [ ! -f "$source_path" ] || [ ! -f "$external_path" ]; then
              return 1
            fi

            source_count="$(runtime_article_count "$source_path")"
            external_count="$(runtime_article_count "$external_path")"

            if [[ "$source_count" =~ ^[0-9]+$ ]] && \
              [[ "$external_count" =~ ^[0-9]+$ ]] && \
              [ "$source_count" -eq 0 ] && \
              [ "$external_count" -gt 0 ]; then
              return 0
            fi

            return 1
          }

          dirty_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty_status" ]; then
            unsafe_dirty=""
            while IFS= read -r status_line; do
              [ -z "$status_line" ] && continue
              dirty_path="${status_line:3}"
              allowed=false
              for generated_path in "${generated_data_paths[@]}"; do
                if [ "$dirty_path" = "$generated_path" ]; then
                  allowed=true
                  break
                fi
              done

              if [ "$allowed" != true ]; then
                unsafe_dirty="${unsafe_dirty}${status_line}"$'\n'
              fi
            done <<< "$dirty_status"

            if [ -n "$unsafe_dirty" ]; then
              printf '%s\n' "$dirty_status"
              echo "Refusing to deploy over a dirty VPS working tree. Commit or stash direct edits first." >&2
              exit 1
            fi

            echo "Migrating generated runtime data out of the Git checkout before deploy:"
            for generated_path in "${generated_data_paths[@]}"; do
              if [ -f "$generated_path" ]; then
                external_path="$runtime_data_root/${generated_path#dev.chinesearizona.com/web/}"
                if should_preserve_external_runtime_data "$generated_path" "$external_path"; then
                  echo "Preserving non-empty runtime data fixture $external_path; checked-out source has no articles."
                  continue
                fi

                mkdir -p "$(dirname "$external_path")"
                cp "$generated_path" "$external_path"
                echo "  $generated_path -> $external_path"
              fi
            done
            git checkout -- "${generated_data_paths[@]}"
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            echo "Refusing to deploy over a dirty VPS working tree. Commit or stash direct edits first." >&2
            exit 1
          fi

          git fetch origin main
          git fetch origin "$DEPLOY_SHA"
          latest_main_sha="$(git rev-parse origin/main)"
          if [ "$DEPLOY_SHA" = "$latest_main_sha" ]; then
            git checkout --force -B main "$DEPLOY_SHA"
            git branch --set-upstream-to=origin/main main
          else
            git checkout --force --detach "$DEPLOY_SHA"
          fi

          for generated_path in "${generated_data_paths[@]}"; do
            external_path="$runtime_data_root/${generated_path#dev.chinesearizona.com/web/}"
            if [ ! -f "$external_path" ] && [ -f "$generated_path" ]; then
              mkdir -p "$(dirname "$external_path")"
              cp "$generated_path" "$external_path"
              echo "Seeded runtime data fixture $external_path"
            fi
          done

          cd /var/www/dev.chinesearizona.com/web
          export CHINESEARIZONA_RUNTIME_DATA_ROOT="$runtime_data_root"
          export RADAR_STORE_PATH_AUSTIN="$runtime_data_root/data/sites/austin/radar-runtime/store.json"
          export RADAR_STORE_PATH_LOS_ANGELES="$runtime_data_root/data/sites/los-angeles/radar-runtime/store.json"
          export SF_BAY_RADAR_STORE_PATH="$runtime_data_root/data/sf-bay-radar-runtime/store.json"
          export ARTICLE_EN_TRANSLATION_CACHE_PATH="$runtime_data_root/data/article-ingest-staging/english-translation-cache.json"
          export ARTICLE_ZH_TRANSLATION_CACHE_PATH="$runtime_data_root/data/article-ingest-staging/chinese-translation-cache.json"
          export GENERATED_LOCAL_ARTICLES_PATH="$runtime_data_root/src/data/generated-local-articles.json"
          npm ci
          node scripts/arizona_radar/repair_current_article_images.cjs --strict
          npm run build

          export GIT_SHA="$DEPLOY_SHA"
          export NEXT_PUBLIC_GIT_SHA="$DEPLOY_SHA"
          export BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          export NEXT_PUBLIC_BUILD_TIME="$BUILD_TIME"
          pm2 startOrReload ecosystem.config.cjs --only dev-chinesearizona --update-env
          pm2 save

          rollback_to_previous_sha() {
            if [ "$previous_sha" = "$DEPLOY_SHA" ]; then
              echo "Smoke failed, but previous SHA matches deploy SHA; no rollback target is available." >&2
              return 1
            fi

            echo "Smoke failed; rolling back to previous SHA $previous_sha." >&2
            cd /var/www
            git fetch origin "$previous_sha" || true
            latest_main_sha="$(git rev-parse origin/main)"
            if [ "$previous_sha" = "$latest_main_sha" ]; then
              git checkout --force -B main "$previous_sha"
              git branch --set-upstream-to=origin/main main
            else
              git checkout --force --detach "$previous_sha"
            fi

            cd /var/www/dev.chinesearizona.com/web
            export GIT_SHA="$previous_sha"
            export NEXT_PUBLIC_GIT_SHA="$previous_sha"
            export BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            export NEXT_PUBLIC_BUILD_TIME="$BUILD_TIME"
            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.cjs --only dev-chinesearizona --update-env
            pm2 save
            npm run smoke:dev
          }

          if ! npm run smoke:dev; then
            npm run loop:collect || true
            rollback_to_previous_sha || true
            npm run loop:collect || true
            exit 1
          fi

          npm run loop:collect || true
          REMOTE
