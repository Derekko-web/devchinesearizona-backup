name: Deploy Prod

# Manual only. Each run waits for a reviewer to approve it in the `production`
# environment. See "Production deploys" in dev.chinesearizona.com/web/README.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy builds and ships a SHA. rollback switches back to the previous release in seconds.
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      sha:
        description: Full commit SHA. Deploy defaults to the SHA dev is running now. Rollback defaults to the previous release.
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://chinesearizona.com
    env:
      ACTION: ${{ inputs.action }}
      INPUT_SHA: ${{ inputs.sha }}
      VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
      VPS_PORT: ${{ secrets.PROD_VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.PROD_VPS_SSH_KNOWN_HOSTS }}
      VPS_USER: ${{ secrets.PROD_VPS_USER || 'derek' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require a reviewer on the production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub creates a missing environment with no protection, so check.
          reviewers="$(
            gh api "/repos/$GITHUB_REPOSITORY/environments/production" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length'
          )"
          if [ "${reviewers:-0}" -lt 1 ]; then
            echo "The production environment has no required reviewer. Add one in Settings > Environments > production before deploying." >&2
            exit 1
          fi

      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail

          if [ "$ACTION" = "rollback" ]; then
            if [ -n "$INPUT_SHA" ] && ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Rollback SHA must be a full 40-character commit SHA." >&2
              exit 1
            fi
            echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha="$INPUT_SHA"
          if [ -z "$sha" ]; then
            sha="$(curl -sS --max-time 20 https://dev.chinesearizona.com/api/health | jq -r '.gitSha // empty')"
            echo "No SHA given; dev is running $sha."
          fi

          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deploy needs a full 40-character commit SHA, got '$sha'." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check the SHA already shipped to dev
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "Deploy target $DEPLOY_SHA is not on main. Deploy Prod only accepts main commits." >&2
            exit 1
          fi

          ci_conclusion="$(
            gh api \
              --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f head_sha="$DEPLOY_SHA" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].conclusion // empty'
          )"
          if [ "$ci_conclusion" != "success" ]; then
            echo "Deploy Prod for $DEPLOY_SHA requires a successful Dev CI run first." >&2
            exit 1
          fi

          # A Deploy Dev run can succeed without deploying (it skips stale SHAs),
          # so look for a run whose deploy step itself succeeded.
          # Filter by conclusion here, not with the API's status=success: for a
          # run that finished minutes earlier GitHub returned an empty list with
          # that filter and the run without it (#519).
          dev_run_ids="$(
            gh api \
              --method GET \
              --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-dev.yml/runs" \
              -f head_sha="$DEPLOY_SHA" \
              -f per_page=100 \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id'
          )"
          for run_id in $dev_run_ids; do
            step_conclusion="$(
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                --jq '[.jobs[].steps[]? | select(.name == "Deploy exact SHA to VPS") | .conclusion] | first // empty'
            )"
            if [ "$step_conclusion" = "success" ]; then
              echo "Deploy Dev shipped $DEPLOY_SHA in run $run_id."
              exit 0
            fi
          done

          echo "Deploy Prod for $DEPLOY_SHA requires a Deploy Dev run that shipped it to dev first." >&2
          exit 1

      - uses: actions/checkout@v6
        if: inputs.action == 'deploy'
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: release-src

      - uses: actions/setup-node@v6
        if: inputs.action == 'deploy'
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: release-src/dev.chinesearizona.com/web/package-lock.json

      - name: Verify the target SHA
        if: inputs.action == 'deploy'
        working-directory: release-src/dev.chinesearizona.com/web
        run: |
          npm ci
          npm run verify

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          if [ -z "$VPS_SSH_KNOWN_HOSTS" ]; then
            echo "Set PROD_VPS_SSH_KNOWN_HOSTS in the production environment. Deploy Prod does not trust unknown host keys." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run on VPS
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -i ~/.ssh/prod_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectionAttempts=5 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- $ACTION $TARGET_SHA" < ops/deploy-prod/deploy-prod.sh
