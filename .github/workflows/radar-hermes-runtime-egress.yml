name: Radar Hermes Runtime Egress

on:
  workflow_run:
    workflows:
      - Deploy Dev
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA already deployed to the VPS. Defaults to the selected ref.
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: radar-hermes-runtime-egress
  cancel-in-progress: true

jobs:
  apply-runtime-egress:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: dev-runtime
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
      VPS_PORT: ${{ secrets.DEV_VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.DEV_VPS_RUNTIME_EGRESS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.DEV_VPS_SSH_KNOWN_HOSTS }}
      VPS_USER: ${{ secrets.DEV_VPS_RUNTIME_EGRESS_USER }}
      SSH_STRICT_HOST_KEY_CHECKING: yes
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          if [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "Set DEV_VPS_RUNTIME_EGRESS_USER and DEV_VPS_RUNTIME_EGRESS_SSH_KEY to an approved runtime operator before running this workflow." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/runtime_egress_key
          chmod 600 ~/.ssh/runtime_egress_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            exit 0
          fi

          keyscan_output="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -4 -H -T 30 -p "$VPS_PORT" "$VPS_HOST" > "$keyscan_output" && [ -s "$keyscan_output" ]; then
              cat "$keyscan_output" >> ~/.ssh/known_hosts
              rm -f "$keyscan_output"
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "ssh-keyscan failed; retrying in $((attempt * 5)) seconds." >&2
              sleep $((attempt * 5))
            fi
          done

          rm -f "$keyscan_output"
          echo "Unable to fetch the VPS SSH host key after 5 attempts; falling back to StrictHostKeyChecking=accept-new." >&2
          echo "SSH_STRICT_HOST_KEY_CHECKING=accept-new" >> "$GITHUB_ENV"

      - name: Apply radar Hermes runtime egress
        run: |
          ssh -i ~/.ssh/runtime_egress_key \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectionAttempts=5 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking="$SSH_STRICT_HOST_KEY_CHECKING" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'REMOTE'
          set -euo pipefail

          web_root=/var/www/dev.chinesearizona.com/web
          cd "$web_root"

          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$DEPLOY_SHA" ]; then
            echo "Refusing to apply radar/Hermes runtime egress to stale checkout." >&2
            echo "Expected deployed SHA: $DEPLOY_SHA" >&2
            echo "Current VPS SHA: $current_sha" >&2
            exit 1
          fi

          if ! bash ../../ops/radar-hermes-egress/install-app-env-override.sh; then
            npm run loop:collect || true
            exit 1
          fi

          if ! bash ../../ops/radar-hermes-egress/apply-runtime-deploy.sh; then
            npm run loop:collect || true
            exit 1
          fi

          npm run loop:collect || true
          REMOTE
