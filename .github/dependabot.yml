version: 2
updates:
  - package-ecosystem: npm
    directory: /dev.chinesearizona.com/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Phoenix
    groups:
      npm-security-and-minor:
        patterns:
          - "*"
        exclude-patterns:
          - stripe
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: undici
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /dev.chinesearizona.com/web
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Phoenix

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Phoenix
