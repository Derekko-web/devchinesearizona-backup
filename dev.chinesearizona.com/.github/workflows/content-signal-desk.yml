name: Content Signal Desk

on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * *'

jobs:
  build-signal-desk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate signal desk content
        run: npm run scrape:signal-desk

      - name: Verify content fixtures
        run: npm test
